baseline:
  svr_rff_dim: 256
  svr_gamma: 1.0
  svr_seed: 0
custom_metrics:
- earne_mae_load
- earne_mae_pv
dataset:
  dir: datasets/earne
  format: earne_loader_new
  name: single_read
  shuffle_split: false
  task: graph
  task_type: regression
  transductive: false
earne_data:
  energy_norm_mode:
    consumption: log1p
    generation: ihs
    load: log1p
    pv: ihs
  filter_ids: []
  filter_zips: []
  graph_mode: static_corr
  k_neighbors: 10
  processed_root: datasets/earne
  weather_features:
  - solar_radiation_avg
  - solar_radiation_max
  - sunshine_duration_min
  - air_temperature
  - soil_temp_5cm
  weather_mode: true
  weather_norm_mode:
    all_features: znorm
  zipcode_coords: ../../exploratory-data-analysis/assets/zipcode_coordinate.csv
metric_best: loss
model:
  dim_in: 1
  loss_fun: earne_loss
  n_quantiles: 3
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  seq_len: 96
  type: baseline_svr
num_workers: 4
optim:
  base_lr: 0.001
  max_epoch: 200
  optimizer: adam
  scheduler: warmup_cos
  # SVR's ridge/margin term -- the main regularization knob for this
  # baseline (see baseline_svr.py); tune alongside svr_rff_dim/svr_gamma.
  weight_decay: 0.001
out_dir: results/baseline_svr_grid
train:
  batch_size: 32
  ckpt_period: 10
  early_stopping:
    enable: true
    mode: min
    monitor: val_loss
    patience: 10
  eval_period: 1
  mode: earne_train
  physics_weight: 0.0
  train_split: 0.6
  val_split: 0.85
  wandb:
    project: earne_single
    run_name: baseline_svr-weather=True
  warmup:
    enable: true
    epochs: 10
