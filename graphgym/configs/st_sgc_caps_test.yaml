custom_metrics:
- st_caps_rmse
- st_caps_mae

dataset:
  dir: datasets/earne
  format: earne_loader_new
  name: earne_exp2
  shuffle_split: false
  task: graph
  task_type: regression
  transductive: false

earne_data:
  dual_read: false
  graph_mode: spatial_knn
  k_neighbors: 5
  max_nodes: 10
  filter_ids: []
  filter_zips: []
  energy_norm_mode:
    load: log1p
    pv: ihs
    net_demand: ihs
  weather_features: []
  weather_mode: false
  processed_root: datasets/earne

st_caps:
  n_user: 10
  m: 10          # reduced window for quick test (default 35)
  m_prime: 12    # reduced (default 45)
  M_prime: 32    # hidden dim (default 128)
  M: 2           # LSTM layers (default 8)
  R: 2           # attention heads (default 3)
  q: 20          # dictionary atoms (default 85)
  routing_iterations: 2
  lambda_SC: 0.1
  lambda_S: 1.0
  lambda_L: 1.0
  lambda_PV: 1.0
  lambda_graph: 0.25
  decoder_e:
    layers: [32, 64]
  decoder_s:
    layers: [64, 32]

model:
  predict_targets:
  - load
  - pv
  dim_in: 1
  loss_fun: st_caps_loss
  seq_len: 96
  type: st_sgc_caps

gnn:
  layers_mp: 0

optim:
  base_lr: 0.001
  max_epoch: 3
  optimizer: adam
  scheduler: none

out_dir: results/st_sgc_caps_test

train:
  batch_size: 1
  ckpt_period: 1
  eval_period: 1
  mode: earne_train
  limit_batches: 20
  train_split: 0.7
  val_split: 0.85
  physics_weight: 0.0
  crossing_weight: 0.0
  early_stopping:
    enable: false
    monitor: val_loss
    patience: 5
    mode: min
  warmup:
    enable: false
    epochs: 1

metric_best: loss
num_workers: 0
