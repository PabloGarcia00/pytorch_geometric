conv1d_kernel_size: 96
custom_metrics:
- earne_mae_load
- earne_mae_pv
dataset:
  dir: datasets/earne
  format: earne_loader_new
  name: earne_exp2
  task: graph
  task_type: regression
  transductive: false
earne_data:
  dual_read: false
  energy_norm_mode:
    consumption: log1p
    generation: ihs
    load: log1p
    pv: ihs
  filter_ids: []
  filter_zips: []
  graph_mode: learned_corr
  k_neighbors: 5
  max_nodes: 10
  weather_mode: true
  gold_data: /home/llan/projects/messm/pytorch_geometric/fleet_gold_layer_with_csi.parquet
  processed_root: datasets/earne_csi_test
  weather_features:
  - temperature_2m_om_mean
  - temperature_2m_om_std
  - shortwave_radiation_om_mean
  - shortwave_radiation_om_std
  - clearsky_index_mean
  - clearsky_index_std
  - is_clear_sky_day
  weather_norm_mode:
    all_features: znorm
  zipcode_coords: ../../exploratory-data-analysis/assets/zipcode_coordinate.csv
gnn:
  act: relu
  att_heads: 4
  batchnorm: false
  dim_inner: 64
  dropout: 0.1
  layer_type: gatconv
  layers_mp: 0
  layers_post_mp: 2
  layers_pre_mp: 0
  stage_type: stack
metric_best: loss
model:
  predict_targets:
  - load
  - pv
  dim_in: 1
  head_name: earne_quantile
  hidden_channels: 64
  loss_fun: earne_loss
  n_quantiles: 3
  node_encoder_name: earne_temporal
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  seq_len: 96
  type: earne_network
num_workers: 0
optim:
  base_lr: 0.001
  max_epoch: 1
  optimizer: adam
  scheduler: cos
out_dir: results/csi_feature_test
train:
  batch_size: 8
  ckpt_period: 10
  eval_period: 1
  mode: earne_train
  physics_weight: 0.0
  train_split: 0.7
  val_split: 0.85
