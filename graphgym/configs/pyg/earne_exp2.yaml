out_dir: results
num_workers: 4
dataset:
  format: earne_loader_new
  name: earne_exp2
  dir: datasets/earne
  task: graph
  task_type: regression
  transductive: false

train:
  mode: standard
  batch_size: 32
  eval_period: 1
  ckpt_period: 10
  train_split: 0.7
  val_split: 0.85
  physics_weight: 0.0

model:
  predict_targets:
  - load
  - pv
  type: earne_network
  node_encoder_name: earne_temporal
  head_name: earne_quantile
  loss_fun: earne_loss
  seq_len: 96 # 24h context at 15-min cadence
  dim_in: 1
  hidden_channels: 64
  n_quantiles: 3
  quantiles:
    - 0.1
    - 0.5
    - 0.9

conv1d_kernel_size: 96 # 6h receptive field (must be <= seq_len)

gnn:
  layers_pre_mp: 0
  layers_mp: 2
  layers_post_mp: 2
  dim_inner: 64
  layer_type: gatconv
  stage_type: stack
  batchnorm: false
  act: relu
  dropout: 0.1
  att_heads: 4

optim:
  optimizer: adam
  base_lr: 0.001
  max_epoch: 100
  scheduler: cos

metric_best: loss

earne_data:
  days: 730
  graph_mode: spatial_knn
  k_neighbors: 5
  energy_norm_mode:
    load: ihs
    pv: ihs
    net_demand: ihs
  weather_norm_mode:
    all_features: znorm
  dual_read: false
  mask_weather: false
  processed_root: datasets/earne
  zipcode_coords: ../../exploratory-data-analysis/assets/zipcode_coordinate.csv
