out_dir: results
num_workers: 4
dataset:
  format: earne_loader_new
  name: earne_exp2
  dir: datasets/earne
  task: graph
  task_type: regression
  transductive: false
train:
  mode: example
  batch_size: 32
  eval_period: 1
  ckpt_period: 10
  physics_weight: 0.0
model:
  type: earne_network
  loss_fun: earne_loss
  graph_pooling: add
  dim_in: 1 # set to 2 when dual_read=True
gnn:
  layers_pre_mp: 0
  layers_mp: 2
  layers_post_mp: 2
  dim_inner: 64
  layer_type: gatconv
  stage_type: stack
  batchnorm: false
  act: relu
  dropout: 0.1
  att_heads: 4
optim:
  optimizer: adam
  base_lr: 0.001
  max_epoch: 50
  scheduler: cos
earne_data:
  cadence_minutes: 15
  days: 365
  n_user: 50
  graph_mode: spatial_knn
  norm_mode: minmax
  dual_read: false
  processed_root: datasets/earne
  raw_data_path: ../../exploratory-data-analysis/output/clean_data_hive
