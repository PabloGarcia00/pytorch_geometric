out_dir: results
num_workers: 0
dataset:
  format: earne_loader_new
  name: earne_st_gnn_single_optimal_pvonly_lstm_encoder
  dir: datasets/earne_csi
  task: graph
  task_type: regression
  transductive: false
  shuffle_split: false
train:
  mode: earne_train
  batch_size: 32
  eval_period: 1
  ckpt_period: 10
  train_split: 0.7
  val_split: 0.85
  physics_weight: 0.0
  crossing_weight: 0.0
  early_stopping:
    enable: true
    monitor: val_loss
    patience: 10
    mode: min
  warmup:
    enable: true
    epochs: 10
  wandb:
    project: earne
model:
  predict_targets:
  - pv
  type: earne_network
  # One-off test: same ST-GNN model (real GATConv message passing, gnn.layers_mp
  # unchanged below) but with the LSTM baseline's temporal encoder swapped in
  # for the default CNN-based earne_temporal encoder -- does message passing
  # still help when paired with a recurrent rather than convolutional
  # per-node encoder? cfg.baseline.lstm_hidden_dim/lstm_layers/lstm_dropout
  # are left at their config/baseline.py defaults (32/1/0.1), same as the
  # LSTM baseline uses.
  node_encoder_name: baseline_lstm_temporal
  head_name: earne_quantile
  loss_fun: earne_loss
  seq_len: 96
  dim_in: 1
  hidden_channels: 64
  n_quantiles: 3
  quantiles:
  - 0.1
  - 0.5
  - 0.9
gnn:
  layers_pre_mp: 0
  layers_mp: 3
  layers_post_mp: 3
  dim_inner: 64
  layer_type: gatconv
  stage_type: stack
  batchnorm: false
  act: relu
  dropout: 0.1
  att_heads: 4
  clear_feature: false
  keep_edge: 1.0
  l2norm: false
optim:
  optimizer: adam
  base_lr: 0.001
  max_epoch: 200
  scheduler: warmup_cos
metric_best: loss
earne_data:
  graph_mode: learned_corr
  lambda_graph: 0.25
  k_neighbors: 10
  dual_read: false
  weather_mode: false
  require_full_span: true
  mask_physics_impossible: false
  energy_norm_mode:
    load: log1p
    pv: ihs
    net_demand: ihs
  weather_norm_mode:
    all_features: znorm
  weather_features:
  - temperature_2m_om_mean
  - clearsky_index_mean
  - cloud_cover_low_om_mean
  processed_root: datasets/earne_csi
  zipcode_coords: ../../exploratory-data-analysis/assets/zipcode_coordinate.csv
  filter_zips: []
  filter_ids: []
custom_metrics:
- earne_mae_load
- earne_mae_pv
